name: Test baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate V1 test structure
        run: python tools/validate_test_structure.py

      - name: Run unit tests
        run: python tools/run_unit_tests.py
